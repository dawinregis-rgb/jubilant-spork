<head>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; }
        .header { background-color: #ffffff; padding: 20px 40px; border-bottom: 1px solid #e0e0e0; }
        .logo-text { font-size: 28px; font-weight: 900; color: #c40018; text-decoration: none; letter-spacing: -1px; }
        .logo-text span { font-weight: 400; color: #333; }
        .main-bg { background-color: #f8f9fa; flex: 1; display: flex; justify-content: center; padding-top: 60px; padding-bottom: 60px; border-bottom: 1px solid #e0e0e0; }
        .login-container { width: 100%; max-width: 500px; background: transparent; }
        .page-title { font-size: 28px; font-weight: 700; color: #222; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #222; }
        .error-box { display: none; background-color: #fff8f8; border: 1px solid #ffcdd2; padding: 15px; font-size: 13px; color: #d32f2f; margin-bottom: 20px; align-items: center; border-radius: 4px; line-height: 1.5; }
        .error-box i { margin-right: 10px; font-size: 16px; }
        .error-box.visible { display: flex; }
        .info-text { font-size: 14px; color: #333; margin-bottom: 15px; }
        .input-group { margin-bottom: 10px; }
        .input-group input { width: 100%; border: 1px solid #ccc; padding: 15px; font-size: 14px; color: #333; outline: none; transition: border-color 0.2s; background-color: #fff; }
        .input-group input:focus { border-color: #c40018; }
        .input-group input::placeholder { color: #999; }
        .options-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #333; margin-top: 10px; margin-bottom: 25px; }
        .checkbox-wrap { display: flex; align-items: center; cursor: pointer; }
        .checkbox-wrap input { margin-right: 6px; accent-color: #c40018; }
        .options-row a { color: #333; text-decoration: none; }
        .options-row a:hover { text-decoration: underline; }
        .btn-login { width: 100%; background-color: #c40018; color: #fff; border: none; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        .btn-login:hover { background-color: #a00013; }
        .btn-login:disabled { background-color: #e57373; cursor: not-allowed; }
        .btn-join { width: 100%; background-color: #fff; color: #c40018; border: 1px solid #c40018; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; text-decoration: none; display: block; text-align: center; }
        .btn-join:hover { background-color: #fff5f5; }
        .hide-field { display: none !important; }
        .footer { text-align: center; padding: 30px; font-size: 12px; color: #666; line-height: 1.8; background-color: #fff; }

    <div class="header">
        <a href="#" onclick="return false;" class="logo-text">Gobiz<span>KOREA</span></a>

    <div class="main-bg">
        <div class="login-container">
            <div class="page-title">로그인</div>

            <div class="error-box" id="errorBox">

            <div class="info-text" id="infoText">아이디(또는 이메일)와 패스워드를 입력해 주십시오.</div>

            <form id="loginForm">
                <div class="input-group" id="emailGroup">
                    <input type="email" id="account" name="user" placeholder="아이디(또는 이메일)" required>
                </div>

                <div class="input-group" id="passwordGroup">
                    <input type="password" id="password" name="passwd" placeholder="비밀번호" required>
                </div>

                <div class="options-row" id="optionsSection">
                    <label class="checkbox-wrap">
                        <input type="checkbox" checked> 로그인 상태 유지
                    </label>
                    <a href="#">아이디/비밀번호 찾기</a>
                </div>

                <button type="submit" class="btn-login" id="submitBtn">로그인</button>
            </form>

            <a href="#" class="btn-join" id="joinBtn">회원가입</a>
        </div>
    </div>
